<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON SURGE — twin-stick arena shooter</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070512; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="NEON SURGE: move with WASD, aim with the mouse, hold click to fire, survive ten waves"></canvas>
<p id="status" role="status" aria-live="polite">NEON SURGE. Press Enter to play.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
